<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configuración de Elección - FNE 2026</title>
    <style>
        body { 
            font-family: 'Segoe UI', sans-serif; 
            background: linear-gradient(135deg, #0f0c20 0%, #15102a 100%); 
            padding: 20px; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
        }
        .card-admin { 
            background: rgba(255, 255, 255, 0.98); 
            width: 100%; 
            max-width: 550px; 
            padding: 40px; 
            border-radius: 24px; 
            box-shadow: 0 20px 40px rgba(0,0,0,0.4); 
            text-align: center; 
            border-top: 6px solid #764ba2; 
        }
        .form-group {
            text-align: left;
            margin-bottom: 22px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #3b2d54;
            font-size: 0.95em;
        }
        .input-control {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 1em;
            box-sizing: border-box;
            transition: 0.3s;
            outline: none;
        }
        .input-control:focus {
            border-color: #764ba2;
            box-shadow: 0 0 0 3px rgba(118, 75, 162, 0.15);
        }
        .input-file {
            padding: 15px;
            border: 2px dashed #764ba2;
            background: #fcfaff;
            cursor: pointer;
        }
        .btn-importar { 
            background: linear-gradient(135deg, #764ba2 0%, #667eea 100%); 
            color: white; 
            border: none; 
            padding: 15px 30px; 
            border-radius: 25px; 
            font-weight: bold; 
            cursor: pointer; 
            width: 100%; 
            box-shadow: 0 4px 15px rgba(118, 75, 162, 0.3); 
            font-size: 1.05em; 
            transition: 0.3s; 
            margin-top: 10px; 
        }
        .btn-importar:hover { 
            transform: translateY(-2px); 
            box-shadow: 0 6px 20px rgba(118, 75, 162, 0.5); 
        }
        .btn-volver { 
            display: inline-block; 
            margin-top: 25px; 
            color: #764ba2; 
            text-decoration: none; 
            font-size: 0.95em; 
            font-weight: 600;
            transition: 0.3s; 
        }
        .btn-volver:hover { 
            color: #55337a;
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="card-admin">
    <div style="font-size: 3.5em; margin-bottom: 10px;">⚙️</div>
    <h2 style="color: #2c3e50; margin: 0 0 10px 0;">Inicializar Nuevo Colegio</h2>
    <p style="color: #666; font-size: 0.95em; line-height: 1.5; margin-bottom: 30px;">
        Configurá el establecimiento y cargá el archivo de postulantes. Al procesar, se vaciarán de forma segura los registros de la elección anterior.
    </p>

    <form action="/admin/cargar_masiva" method="POST" enctype="multipart/form-data" onsubmit="return confirmarCargaMasiva();">
        
        <div class="form-group">
            <label for="nombre_colegio">Nombre del Establecimiento / Colegio:</label>
            <input type="text" name="nombre_colegio" id="nombre_colegio" class="input-control" 
                   placeholder="Ej: Escuela Provincial N° 1" value="{{ colegio_actual }}" required>
        </div>

        <div class="form-group">
            <label for="archivo_csv">Lista de Postulantes (.csv):</label>
            <input type="file" name="archivo_csv" id="archivo_csv" class="input-control input-file" 
                   accept=".csv, text/csv, application/csv, text/comma-separated-values" required>
        </div>
        
        <button type="submit" class="btn-importar">
            🚀 Formatear e Inicializar Elección
        </button>
    </form>

    <a href="{{ url_for('index') }}" class="btn-volver">← Cancelar y Volver</a>
</div>

<script>
    function confirmarCargaMasiva() {
        const colegio = document.getElementById('nombre_colegio').value.trim();
        const r1 = confirm("¿Estás seguro de inicializar el sistema?\n\nSe eliminarán todos los votos actuales y la lista previa para dar de alta al colegio:\n" + colegio);
        if (r1) {
            return confirm("⚠️ CONFIRMACIÓN FINAL ⚠️\n\n¿Validaste que no queden datos pendientes por registrar? Presioná Aceptar para aplicar la reconfiguración.");
        }
        return false;
    }
</script>

</body>
</html>
