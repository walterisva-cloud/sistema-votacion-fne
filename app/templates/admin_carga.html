<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configuración de Elección - FNE 2026</title>
    <style>
        body { 
            font-family: 'Segoe UI', sans-serif; 
            background: linear-gradient(135deg, #0f0c20 0%, #15102a 100%); 
            padding: 20px; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
        }
        .card-admin { 
            background: rgba(255, 255, 255, 0.98); 
            width: 100%; 
            max-width: 550px; 
            padding: 40px; 
            border-radius: 24px; 
            box-shadow: 0 20px 40px rgba(0,0,0,0.4); 
            text-align: center; 
            border-top: 6px solid #764ba2; 
        }
        .form-group {
            text-align: left;
            margin-bottom: 22px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #3b2d54;
            font-size: 0.95em;
        }
        .input-control {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 1em;
            box-sizing: border-box;
            transition: 0.3s;
            outline: none;
        }
        .input-control:focus {
            border-color: #764ba2;
            box-shadow: 0 0 0 3px rgba(118, 75, 162, 0.15);
        }
        .input-file {
            padding: 15px;
            border: 2px dashed #764ba2;
            background: #fcfaff;
            cursor: pointer;
        }
        .btn-importar { 
            background: linear-gradient(135deg, #764ba2 0%, #667eea 100%); 
            color: white; 
            border: none; 
            padding: 15px 30px; 
            border-radius: 25px; 
            font-weight: bold; 
            cursor: pointer; 
            width: 100%; 
            box-shadow: 0 4px 15px rgba(118, 75, 162, 0.3); 
            font-size: 1.05em; 
            transition: 0.3s; 
            margin-top: 10px; 
        }
        .btn-importar:hover { 
            transform: translateY(-2px); 
            box-shadow: 0 6px 20px rgba(118, 75, 162, 0.5); 
        }
        .btn-volver { 
            display: inline-block; 
            margin-top: 25px; 
            color: #764ba2; 
            text-decoration: none; 
            font-size: 0.95em; 
            font-weight: 600;
            transition: 0.3s; 
        }
        .btn-volver:hover { 
            color: #55337a;
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="card-admin" style="max-width: 550px; width: 100%; margin: 40px auto; background: white; border-radius: 16px; padding: 35px; box-shadow: 0 10px 25px rgba(0,0,0,0.15);">
    
    <div style="font-size: 3.5em; margin-bottom: 10px; text-align: center;">⚙️</div>
    <h2 style="color: #2c3e50; margin: 0 0 5px 0; text-align: center;">Inicializar Nuevo Colegio</h2>
    <p style="color: #718096; text-align: center; font-size: 0.9em; margin: 0 0 30px 0; line-height: 1.4;">
        Configurá el establecimiento y cargá el archivo de postulantes. Al procesar, se vaciarán de forma segura los registros de la elección anterior.
    </p>
    
    <form action="/admin/cargar_masiva" method="POST" enctype="multipart/form-data">
        <div class="form-group" style="margin-bottom: 20px;">
            <label style="display:block; font-weight:600; color:#4a3766; margin-bottom:8px; font-size: 0.95em;">Nombre del Establecimiento / Colegio:</label>
            <input type="text" name="nombre_colegio" id="nombre_colegio" class="input-control" value="{{ colegio_actual }}" required style="width:100%; padding:12px; border-radius:8px; border:1px solid #cbd5e0; box-sizing: border-box; font-size: 1em;">
        </div>

        <div class="form-group" style="margin-bottom: 25px;">
            <label style="display:block; font-weight:600; color:#4a3766; margin-bottom:8px; font-size: 0.95em;">Lista de Postulantes (.csv):</label>
            <div style="border: 2px dashed #9f7aea; padding: 15px; border-radius: 8px; background: #fbf9fe; text-align: center;">
                <input type="file" name="archivo_csv" id="archivo_csv" class="input-control" accept=".csv" required style="width:100%; font-size: 0.95em;">
            </div>
        </div>
        
        <button type="submit" class="btn-importar" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color:white; border:none; padding:14px; width:100%; border-radius:8px; font-weight:bold; cursor:pointer; font-size:1em; box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3); transition: transform 0.2s;">
            🚀 Formatear e Inicializar Elección
        </button>
    </form>

    <div style="text-align: center; margin-top: 30px; border-top: 1px solid #edf2f7; padding-top: 20px;">
        <a href="/resultados" style="color: #718096; text-decoration: none; font-weight: 600; font-size: 0.95em; transition: color 0.2s;">← Cancelar y Volver al Monitor</a>
    </div>
    
</div>

<script>
    function confirmarCargaMasiva() {
        const colegio = document.getElementById('nombre_colegio').value.trim();
        const r1 = confirm("¿Estás seguro de inicializar el sistema?\n\nSe eliminarán todos los votos actuales y la lista previa para dar de alta al colegio:\n" + colegio);
        if (r1) {
            return confirm("⚠️ CONFIRMACIÓN FINAL ⚠️\n\n¿Validaste que no queden datos pendientes por registrar? Presioná Aceptar para aplicar la reconfiguración.");
        }
        return false;
    }
    
</script>

</body>
</html>
